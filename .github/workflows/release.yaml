name: Release Charm

on:
  push:
    branches:
      - main
      - track/**
    paths-ignore:
      - ".github/renovate*"
      - ".github/workflows/release.yaml"
      - ".github/workflows/renovate.yaml"
      - ".github/workflows/update-libs.yaml"
      - ".gitignore"

permissions:
  # Required for all workflows
  security-events: write
  # Only required for workflows in private repositories
  actions: read
  # Write permission needed for the reusable workflow to push git tags
  contents: write

jobs:
  release:
    uses: canonical/observability/.github/workflows/charm-release.yaml@28dcc6051048bdb5b49078d834dfa05a8136b30d # v2
    secrets: inherit
    with:
      provider: machine
      default-track: dev

