# Learn more about charmcraft.yaml configuration at:
# https://juju.is/docs/sdk/charmcraft-config
name: parca-agent
type: charm
summary: eBPF-based continuous profiling agent.
description: |
  Parca Agent is a subordinate Juju charm that deploys and manages the Parca Agent
  eBPF-based continuous profiling agent on Linux machine units. It is an optional
  complement to the Canonical Observability Stack (COS):
  https://documentation.ubuntu.com/observability

  Parca Agent is an always-on sampling profiler that uses eBPF to capture raw profiling
  data with very low overhead. It samples user-space and kernel-space stack traces 19
  times per second and builds pprof-formatted profiles from the extracted data, covering
  all processes on the host without requiring any instrumentation.

  Being a subordinate charm, it can be related to any machine charm to add
  always-on profiling capability to each of its units, with no changes to the
  principal charm required.

  Key features:

  - eBPF-based always-on sampling profiler: captures profiling data across all
    processes on the host at 19 samples per second with very low overhead.
  - Subordinate charm: attaches to any machine charm via the juju-info relation to
    provide profiling at the unit level.
  - Forwards collected profiles to a Parca server (including parca-k8s) via the
    parca_store interface.
  - Self-monitoring: exposes Prometheus metrics and forwards them via the cos-agent
    relation to Grafana Agent or an OpenTelemetry Collector.
  - TLS support: accepts CA certificates via the receive-ca-cert relation to push
    profiles securely to TLS-enabled Parca backends.

subordinate: true

links:
  documentation: https://discourse.charmhub.io/t/16556
  website: https://charmhub.io/parca-agent
  source: https://github.com/canonical/parca-agent-operator
  issues: https://github.com/canonical/parca-agent-operator/issues

platforms:
  ubuntu@22.04:amd64:
  ubuntu@24.04:amd64:

assumes:
  - juju >= 3.6

parts:
  charm:
    source: .
    plugin: uv
    build-packages: [git]
    build-snaps: [astral-uv]
    override-build: |
      craftctl default
      git describe --always > $CRAFT_PART_INSTALL/version

provides:
  cos-agent:
    interface: cos_agent
    limit: 1

requires:
  juju-info:
    interface: juju-info
    scope: container
  parca-store-endpoint:
    interface: parca_store
    optional: true
  receive-ca-cert:
    interface: certificate_transfer
    optional: true
    description: |
      Obtain CA certificate from a certificates provider charm.
